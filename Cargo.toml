[package]
name = "microcount"
version = "0.1.0"
edition = "2021"
default-run = "microcount"
description = "Semi-automated segmentation and morphometry of microglia and astrocytes"

[dependencies]
anyhow = "1"
# Rust port of OME Bio-Formats: every format it can read can be imported here.
# Local development uses the sibling checkout via .cargo/config.toml.
bioformats = { git = "https://github.com/AlbertUgwudike/ome-bioformats-rs" }
csv = "1.3"
eframe = "0.31.1"
egui = "0.31.1"
egui_extras = "0.31.1"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
rayon = "1.10"
rfd = "0.15"
rust_xlsxwriter = "0.80"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1

# Image processing is unusably slow unoptimised, even while developing.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
